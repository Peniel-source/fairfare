name: Flutter CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      # Line coverage without generated files
      - name: Coverage
        shell: bash
        run: |
          awk -F'[:,]' '
            /^SF:/ { skip = ($2 ~ /firebase_options\.dart$|\.g\.dart$/) }
            /^LF:/ && !skip { total += $2 }
            /^LH:/ && !skip { hit += $2 }
            END {
              if (total == 0) { print "No coverage data"; exit 1 }
              printf "Line coverage: %.1f%% (%d of %d lines)\n", 100 * hit / total, hit, total
            }
          ' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"